<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal InklusiBerbagi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .bg-brand-blue { background-color: #1E3A8A; }
        .text-brand-blue { color: #1E3A8A; }
        .bg-brand-yellow { background-color: #F59E0B; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <div class="min-h-screen flex">
        <!-- Sisi Kiri: Branding -->
        <div class="hidden lg:flex w-1/2 bg-brand-blue text-white flex-col justify-center items-center p-12 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-64 h-64 bg-blue-800 rounded-full mix-blend-multiply filter blur-2xl opacity-70"></div>
            <div class="absolute bottom-0 right-0 w-64 h-64 bg-brand-yellow rounded-full mix-blend-multiply filter blur-2xl opacity-30"></div>
            
            <div class="z-10 text-center">
                <h1 class="text-4xl font-bold mb-4">InklusiBerbagi</h1>
                <p class="text-lg text-blue-100 max-w-md mx-auto">
                    Platform gotong royong modul ajar berdiferensiasi untuk Peserta Didik Berkebutuhan Khusus (PDBK).
                </p>
                <div class="mt-10 bg-white/10 p-8 rounded-xl border border-white/20 backdrop-blur-sm">
                    <p class="italic">"Sendiri kita mungkin bisa cepat, tapi bersama kita bisa sampai jauh."</p>
                </div>
            </div>
        </div>

        <!-- Sisi Kanan: Form Login -->
        <div class="w-full lg:w-1/2 flex flex-col justify-center items-center p-8 bg-white">
            <div class="w-full max-w-md">
                <div class="lg:hidden text-center mb-8">
                    <h1 class="text-3xl font-bold text-brand-blue">InklusiBerbagi</h1>
                </div>

                <h2 class="text-3xl font-bold text-gray-800 mb-2">Selamat Datang Kembali</h2>
                <p class="text-gray-500 mb-8">Silakan masuk menggunakan akun guru Anda.</p>

                <form id="loginForm">
                    <div class="mb-5">
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Guru</label>
                        <input type="email" id="email" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-blue focus:border-brand-blue outline-none transition"
                            placeholder="nama@sekolah.sch.id">
                    </div>

                    <div class="mb-6">
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" id="password" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-blue focus:border-brand-blue outline-none transition"
                            placeholder="••••••••">
                    </div>

                    <button type="submit" id="submitBtn"
                        class="w-full bg-brand-blue hover:bg-blue-900 text-white font-bold py-3 px-4 rounded-lg transition duration-300 shadow-md">
                        Masuk
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Script Supabase -->
    <script>
        // Kredensial Supabase sudah dimasukkan
        const SUPABASE_URL = 'https://zbmeiymlfbviutgcxxcy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_FufWDVwBpxEGC24_KOlXMw_r_rKvbOP';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'Memproses...';
            submitBtn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('Login gagal: ' + error.message);
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
